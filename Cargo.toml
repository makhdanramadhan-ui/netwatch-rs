[package]
name = "netwatch-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Live network packet monitor and rule-based anomaly detector TUI"
repository = "https://github.com/makhdanramadhan-ui/netwatch-rs"
keywords = ["network", "pcap", "tui", "security", "ids"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
etherparse = "0.21"
pcap = "2.5"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
